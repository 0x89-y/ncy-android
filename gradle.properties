org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
# Improves Gradle sync perf for projects with many transitive deps. Recommended
# by AGP; enabling it here removes the "should be enabled" hint from the build
# log without changing runtime behavior.
android.dependency.excludeLibraryComponentsFromConstraints=true
