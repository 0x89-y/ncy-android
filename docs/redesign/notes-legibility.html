<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ncy Note Legibility</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&family=Instrument+Sans:wght@400..600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--page-bg:#E9E7E3;--page-text:#1B1A18;--page-muted:#5F5B55;--page-line:#D3CFC8;--page-card:#F6F5F2;--page-accent:#1B1A18;--page-on-accent:#F6F5F2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page-bg:#111110;--page-text:#ECEAE6;--page-muted:#A29E97;--page-line:#2C2B29;--page-card:#1A1918;--page-accent:#ECEAE6;--page-on-accent:#111110}}
:root[data-theme="dark"]{--page-bg:#111110;--page-text:#ECEAE6;--page-muted:#A29E97;--page-line:#2C2B29;--page-card:#1A1918;--page-accent:#ECEAE6;--page-on-accent:#111110}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page-bg);color:var(--page-text)}
html.embedded,html.embedded body{background:transparent}
body{font-family:'Instrument Sans',system-ui,sans-serif;font-size:15px;line-height:1.5;padding:28px 16px 64px}
html.embedded body{padding:8px 0 24px}
.wrap{max-width:1200px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between;margin-bottom:24px}
h1{font-family:'Newsreader',Georgia,serif;font-weight:500;font-size:32px;line-height:1.1;letter-spacing:-.02em}
.lede{color:var(--page-muted);max-width:640px;margin-top:6px}
.seg{display:inline-flex;border:1px solid var(--page-line);border-radius:999px;padding:3px;background:var(--page-card)}
.seg button{font:inherit;border:0;background:none;cursor:pointer;padding:7px 14px;border-radius:999px;font-size:14px;color:var(--page-muted);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--page-accent);color:var(--page-on-accent)}
.gallery{display:flex;flex-wrap:wrap;gap:36px 22px;justify-content:center}
@media (max-width:820px) and (min-width:600px){.shot{zoom:.88}}
.shot{width:340px;max-width:100%}
.shot h3{font-size:12px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--page-muted);font-weight:500;margin:0 4px 10px}
.shot ul{margin:14px 6px 0;padding-left:18px;font-size:13.5px;color:var(--page-muted)}
.shot li{margin:3px 0}.shot li b{color:var(--page-text);font-weight:600}

/* phone */
.phone{width:340px;max-width:100%;height:720px;border-radius:42px;padding:9px;background:#0A0A0B}
.screen{height:100%;border-radius:34px;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:'Instrument Sans',system-ui,sans-serif}
.sb{height:30px;flex:none}
.bar{display:flex;align-items:center;gap:10px;padding:2px 16px 10px;border-bottom:1px solid var(--line)}
.bar .back{width:22px;height:22px;color:var(--muted)}
.bar .nm{font-family:'Newsreader',serif;font-weight:500;font-size:20px;line-height:1.1}
.bar .st{font-size:12px;color:var(--muted)}
.thread{flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:0 12px 8px;gap:8px}
.day{display:flex;align-items:center;gap:10px;font-family:'Newsreader',serif;font-style:italic;color:var(--muted);font-size:14px;margin:6px 4px 2px}
.day::before,.day::after{content:"";flex:1;height:1px;background:var(--line-strong)}
.t{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted)}
.ci{display:flex;gap:9px;align-items:center;padding:2px 0;font-size:14.5px}
.box{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--outline);flex:none;display:flex;align-items:center;justify-content:center;color:var(--on-accent);font-size:11px}
.box.on{background:var(--accent);border-color:var(--accent)}
.ci.done span:last-child{color:var(--muted);text-decoration:line-through}
.quote{border-left:2px solid var(--accent);padding-left:9px;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.rx{display:inline-flex;gap:5px;margin-top:6px}
.rx span{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line-strong);background:var(--raised)}
.rem{display:inline-flex;margin-top:6px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--on-accent-soft)}
.comp{flex:none;display:flex;gap:8px;align-items:center;padding:8px 10px 12px;border-top:1px solid var(--line)}
.comp .p{width:42px;height:42px;border-radius:50%;border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--text)}
.comp .f{flex:1;height:42px;border-radius:21px;background:var(--raised);border:1px solid var(--line-strong);display:flex;align-items:center;padding:0 14px;color:var(--muted);font-size:14px}
.comp .m{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px}
.dev{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);margin-bottom:2px}
.star{color:var(--accent)}

/* palettes */
.p-now{--bg:#F5F1EA;--surface:#FBF9F5;--raised:#FFFFFF;--text:#1E1A15;--muted:#685F54;--line:#E4DDD1;--line-strong:#D1C8B9;--outline:#8F8678;--accent:#B4471F;--on-accent:#fff;--accent-soft:#F3E2D7;--on-accent-soft:#7A2E12;--ink:#1E1A15;--on-ink:#FBF9F5}
.p-new{--bg:#F3EFE8;--surface:#FBF9F5;--raised:#FFFFFF;--text:#1E1A15;--muted:#685F54;--line:#E2DBCF;--line-strong:#D1C8B9;--outline:#8F8678;--accent:#B4471F;--on-accent:#fff;--accent-soft:#F7E6DB;--accent-edge:#EBCDBB;--on-accent-soft:#7A2E12;--ink:#1E1A15;--on-ink:#FBF9F5}
.dark .p-now{--bg:#15130F;--surface:#1D1A15;--raised:#25211B;--text:#EFE9DF;--muted:#A89F91;--line:#2E2922;--line-strong:#3E372D;--outline:#6F675B;--accent:#E8835C;--on-accent:#1E1A15;--accent-soft:#3A2519;--on-accent-soft:#F4BDA2;--ink:#EFE9DF;--on-ink:#15130F}
/* Softer dark: lifted ground, text eased off pure cream, hairlines quieter. */
.dark .p-new{--bg:#1F1C18;--surface:#27231E;--raised:#2C2822;--text:#DDD5C8;--muted:#A0978A;--line:#332E28;--line-strong:#433C33;--outline:#776E62;--accent:#DD8662;--on-accent:#1F1C18;--accent-soft:#3A2B22;--accent-edge:#4C3528;--on-accent-soft:#EDC3AE;--ink:#DDD5C8;--on-ink:#1F1C18}

/* A: today */
.v-now .note{display:grid;grid-template-columns:38px 1fr;gap:0 8px;padding:4px 2px}
.v-now .note .c{font-size:14.5px;line-height:1.5}

/* B: slips */
.v-slip .note{border-radius:16px;padding:9px 12px 8px;background:var(--raised);border:1px solid var(--line)}
.v-slip .note.mine{background:var(--accent-soft);border-color:var(--accent-edge)}
.v-slip .note .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.v-slip .note .c{font-size:14.5px;line-height:1.5}
.v-slip .note.mine .quote{border-left-color:var(--accent)}

/* C: bubbles */
.v-bub .note{max-width:84%;border-radius:18px;padding:8px 12px 6px;font-size:14.5px;line-height:1.45}
.v-bub .note.mine{align-self:flex-end;background:var(--accent-soft);border:1px solid var(--accent-edge);border-bottom-right-radius:6px}
.v-bub .note.theirs{align-self:flex-start;background:var(--raised);border:1px solid var(--line);border-bottom-left-radius:6px}
.v-bub .note .meta{text-align:right;margin-top:2px}
.v-bub .day{align-self:stretch}
.chipdemo{display:flex;gap:6px;padding:8px 14px 10px;border-bottom:1px solid var(--line)}
.chipdemo span{font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line-strong);color:var(--text)}
.v-now .chipdemo span.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.v-slip .chipdemo span.on,.v-bub .chipdemo span.on{background:var(--accent-soft);color:var(--on-accent-soft);border-color:var(--accent-edge);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Making notes easier to read</h1>
      <p class="lede">The same chat three ways: how it is today, and two fixes. Both fixes put each note in its own box, soften the dark theme, and give the accent real work to do. Your own notes are tinted with the accent, and selected filters use it in place of solid ink.</p>
    </div>
    <div class="seg" role="group" aria-label="Theme">
      <button data-t="light" aria-pressed="false">Light</button>
      <button data-t="dark" aria-pressed="true">Dark</button>
    </div>
  </div>
  <div class="gallery" id="g"></div>
</div>

<template id="thread">
  <div class="sb"></div>
  <div class="bar"><svg class="back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m12 19-7-7 7-7M19 12H5"/></svg><div><div class="nm">Ideas</div><div class="st">5 notes · 1 starred</div></div></div>
  <div class="chipdemo"><span class="on">All 6</span><span>Starred</span><span>Reminders 2</span></div>
  <div class="thread">
    <div class="note mine"><div class="h"><span class="t">16:58</span></div>
      <div class="c"><div class="t" style="margin-bottom:3px">2 / 4</div>
        <div class="ci done"><span class="box on">✓</span><span>Audit current screens</span></div>
        <div class="ci done"><span class="box on">✓</span><span>Pick a type pairing</span></div>
        <div class="ci"><span class="box"></span><span>Mockups for home and chat</span></div>
      </div><div class="meta t"></div></div>
    <div class="day">Yesterday</div>
    <div class="note mine"><div class="h"><span class="t">16:56</span></div><div class="c">Maybe pinned chats become cards at the top, with their checklist progress showing.</div><div class="meta t"></div></div>
    <div class="note theirs"><div class="h"><span class="t">Desk-PC · 17:21</span><span class="t star">★</span></div><div class="c"><div class="quote">Maybe pinned chats become cards…</div>Yes, and show the <b>next reminder</b> on the card too.<br><span class="rx"><span>👍</span><span>💡</span></span></div><div class="meta t"></div></div>
    <div class="day">Today</div>
    <div class="note mine"><div class="h"><span class="t">15:56</span></div><div class="c">Ask Sam about the sync edge-cases doc<br><span class="rem">🔔 Today 22:56</span></div><div class="meta t"></div></div>
  </div>
  <div class="comp"><span class="p">+</span><span class="f">Write a note…</span><span class="m"></span></div>
</template>

<script>
(function(){
  try{if(window.self!==window.top)document.documentElement.classList.add('embedded')}catch(e){document.documentElement.classList.add('embedded')}
  var shots=[
    {cls:'p-now v-now',h:'A · Today',mic:'ink',notes:[
      '<b>No boxes.</b> Notes sit straight on the paper, so where one ends and the next begins is hard to see.',
      '<b>Dark is near-black with bright cream text</b> (about 16:1). The text glares.',
      'Ink does all the work; the accent is only on ticks, reminders and send.']},
    {cls:'p-new v-slip',h:'B · Slips (recommended)',mic:'accent',notes:[
      '<b>Each note is a slip of paper</b> across the full width, so long notes and checklists still get room.',
      '<b>Your notes are accent-tinted,</b> notes from other devices are plain white, so the accent now says "mine".',
      '<b>Softer dark:</b> a lifted brown-black ground, text eased to about 11:1, quieter lines.',
      'The selected filter, the mic and links use the accent instead of ink.']},
    {cls:'p-new v-bub',h:'C · Bubbles',mic:'accent',notes:[
      '<b>Back to bubbles,</b> your notes on the right in the accent tint, other devices on the left.',
      'Most familiar for a chat app, but long notes and checklists get squeezed to about 84% of the width.',
      'Same softer dark and accent use as B.']},
  ];
  var g=document.getElementById('g'),tpl=document.getElementById('thread');
  shots.forEach(function(s){
    var fig=document.createElement('figure');fig.className='shot';
    fig.innerHTML='<h3>'+s.h+'</h3><div class="phone"><div class="screen '+s.cls+'"></div></div><ul>'+s.notes.map(function(n){return '<li>'+n+'</li>'}).join('')+'</ul>';
    var scr=fig.querySelector('.screen');scr.appendChild(tpl.content.cloneNode(true));
    var m=scr.querySelector('.comp .m');m.textContent='🎤';
    m.style.background=s.mic==='ink'?'var(--ink)':'var(--accent)';m.style.color=s.mic==='ink'?'var(--on-ink)':'var(--on-accent)';
    if(s.cls.indexOf('v-now')>=0){
      scr.querySelectorAll('.note').forEach(function(n){var time=n.querySelector('.h .t');var c=n.querySelector('.c');var wrap=document.createElement('div');wrap.className='t';wrap.innerHTML=time.innerHTML.replace('Desk-PC · ','');n.innerHTML='';n.appendChild(wrap);if(time.textContent.indexOf('Desk')>=0){var d=document.createElement('div');d.className='dev';d.textContent='Desk-PC';c.prepend(d)}n.appendChild(c)});
    }
    if(s.cls.indexOf('v-bub')>=0){
      scr.querySelectorAll('.note').forEach(function(n){var h=n.querySelector('.h');var meta=n.querySelector('.meta');var txt=h.textContent.replace('★','').trim();if(txt.indexOf('Desk')>=0){var d=document.createElement('div');d.className='dev';d.textContent='Desk-PC';n.prepend(d);txt=txt.replace('Desk-PC · ','')}meta.textContent=txt;h.remove();if(!n.classList.contains('theirs'))n.classList.add('mine')});
    }
    g.appendChild(fig);
  });
  function setT(t){document.documentElement.dataset.theme=t;document.body.classList.toggle('dark',t==='dark');document.querySelectorAll('[data-t]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.t===t)})}
  document.querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(){setT(b.dataset.t)}});
  setT('dark');
})();
</script>
</body>
</html>
