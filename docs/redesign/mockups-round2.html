<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ncy Notebook Screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&family=Instrument+Sans:wght@400..600&family=JetBrains+Mono:wght@400;500&family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Geist:wght@400..600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --page-bg:#E9E7E3; --page-text:#1B1A18; --page-muted:#5F5B55; --page-line:#D3CFC8; --page-card:#F6F5F2;
  --page-accent:#1B1A18; --page-on-accent:#F6F5F2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page-bg:#111110; --page-text:#ECEAE6; --page-muted:#A29E97; --page-line:#2C2B29; --page-card:#1A1918;
    --page-accent:#ECEAE6; --page-on-accent:#111110;
  }
}
:root[data-theme="dark"]{
  --page-bg:#111110; --page-text:#ECEAE6; --page-muted:#A29E97; --page-line:#2C2B29; --page-card:#1A1918;
  --page-accent:#ECEAE6; --page-on-accent:#111110;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page-bg);color:var(--page-text)}
html.embedded,html.embedded body{background:transparent}
body{font-family:'Instrument Sans',system-ui,sans-serif;font-size:15px;line-height:1.5;padding:28px 16px 64px;-webkit-font-smoothing:antialiased}
html.embedded body{padding:8px 0 24px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1560px;margin:0 auto}
.intro{display:flex;flex-wrap:wrap;gap:20px 40px;align-items:flex-end;justify-content:space-between;margin-bottom:28px}
.intro h1{font-family:'Newsreader',Georgia,serif;font-size:34px;line-height:1.1;font-weight:500;letter-spacing:-.02em}
.intro p{color:var(--page-muted);max-width:680px;margin-top:6px}
.seg{display:inline-flex;border:1px solid var(--page-line);border-radius:999px;padding:3px;background:var(--page-card)}
.seg button{padding:7px 14px;border-radius:999px;font-size:14px;color:var(--page-muted);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--page-accent);color:var(--page-on-accent)}
.seg button:focus-visible{outline:2px solid var(--page-text);outline-offset:2px}
.gallery{display:flex;flex-wrap:wrap;gap:40px 22px;justify-content:center}
@media (max-width:820px) and (min-width:600px){.shot{zoom:.88}.gallery{gap:28px 16px}}
.shot{width:360px;max-width:100%}
.shot h3{font-size:12px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--page-muted);font-weight:500;margin:0 4px 10px}
.shot ul{margin:14px 6px 0;padding-left:18px;font-size:13.5px;color:var(--page-muted)}
.shot li{margin:3px 0}
.shot li b{color:var(--page-text);font-weight:600}

/* ======================= Phone frame ======================= */
.phone{width:360px;max-width:100%;height:760px;border-radius:44px;padding:9px;background:#0A0A0B;box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 30px 60px -30px rgba(0,0,0,.45)}
.screen{height:100%;border-radius:36px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:var(--font-body)}
.sb{height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 26px 0;font-size:13px;font-weight:600;font-family:var(--font-body)}
.sb .ic{display:flex;gap:5px;align-items:center}
.sb .ic i{display:block;background:currentColor;border-radius:2px}
.gesture{height:22px;flex:none;display:flex;align-items:center;justify-content:center}
.gesture::after{content:"";width:110px;height:4px;border-radius:4px;background:var(--text);opacity:.35}
.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.sm{width:16px;height:16px}
.i.xs{width:14px;height:14px}
.i.fill{fill:currentColor}
.iconbtn{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--text)}
.spacer{flex:1}
[data-sketch] svg{display:block;width:100%;height:auto}
.wave{display:flex;align-items:center;gap:2px;height:28px;flex:1;min-width:0}
.wave i{display:block;width:3px;border-radius:2px;background:currentColor;opacity:.35}
.wave i.p{opacity:1}

/* ======================= Direction A — Notebook ======================= */
.dir-a{
  --bg:#F5F1EA; --surface:#FBF9F5; --raised:#FFFFFF; --text:#1E1A15; --muted:#685F54; --line:#E4DDD1; --line-strong:#D1C8B9;
  --accent:#B4471F; --on-accent:#FFFFFF; --accent-soft:#F3E2D7; --on-accent-soft:#7A2E12;
  --ink:#1E1A15; --on-ink:#FBF9F5; --danger:#B42318; --scrim:rgba(30,26,21,.42);
  --font-display:'Newsreader',Georgia,serif; --font-body:'Instrument Sans',system-ui,sans-serif; --font-mono:'JetBrains Mono',ui-monospace,monospace;
}
.theme-dark .dir-a{
  --bg:#15130F; --surface:#1D1A15; --raised:#25211B; --text:#EFE9DF; --muted:#A89F91; --line:#2E2922; --line-strong:#3E372D;
  --accent:#E8835C; --on-accent:#1E1A15; --accent-soft:#3A2519; --on-accent-soft:#F4BDA2;
  --ink:#EFE9DF; --on-ink:#15130F; --danger:#F07A6A; --scrim:rgba(0,0,0,.55);
}
.dir-a .a-head{padding:4px 14px 0 20px}
.dir-a .a-top{display:flex;align-items:center;margin-right:-6px}
.dir-a .a-profile{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);min-height:44px}
.dir-a .a-profile .pdot{width:18px;height:18px;border-radius:6px;background:var(--ink);color:var(--on-ink);display:inline-flex;align-items:center;justify-content:center;font-size:10px}
.dir-a .a-title{font-family:var(--font-display);font-weight:500;font-size:40px;line-height:1.05;letter-spacing:-.02em;margin-top:2px}
.dir-a .a-sync{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);margin:6px 0 12px}
.dir-a .a-sync .dot{width:7px;height:7px;border-radius:50%;background:#3E9B5B;box-shadow:0 0 0 3px color-mix(in srgb,#3E9B5B 22%,transparent)}
.dir-a .a-chips{display:flex;gap:8px;padding:0 20px 12px;overflow:hidden;flex:none}
.dir-a .chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line-strong);font-size:14px;color:var(--text);white-space:nowrap}
.dir-a .chip .n{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.dir-a .chip.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.dir-a .chip.on .n{color:var(--on-ink);opacity:.7}
.dir-a .a-scroll{flex:1;overflow:hidden;border-top:1px solid var(--line)}
.dir-a .a-upnext{margin:14px 16px 4px;padding:12px 14px;border-radius:14px;background:var(--accent-soft);color:var(--on-accent-soft);display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center}
.dir-a .a-upnext .lbl{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.dir-a .a-upnext .what{grid-column:2;font-size:14.5px;color:var(--text);font-weight:500;line-height:1.35}
.dir-a .a-upnext .when{grid-column:2;font-size:12.5px}
.dir-a .a-upnext .i{grid-row:1/4}
.dir-a .a-upnext .more{grid-row:1/4;grid-column:3;font-family:var(--font-mono);font-size:11px}
.dir-a .a-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:16px 20px 4px}
.dir-a .a-row{display:flex;gap:14px;padding:11px 20px;align-items:center;position:relative}
.dir-a .a-row + .a-row::before{content:"";position:absolute;top:0;left:76px;right:0;height:1px;background:var(--line)}
.dir-a .a-av{width:42px;height:42px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:21px;font-weight:500;
  background:color-mix(in srgb,var(--h) 17%,var(--surface));color:color-mix(in srgb,var(--h) 72%,var(--text))}
.theme-dark .dir-a .a-av{background:color-mix(in srgb,var(--h) 22%,var(--surface));color:color-mix(in srgb,var(--h) 55%,var(--text))}
.dir-a .a-av.lock{background:var(--ink);color:var(--on-ink)}
.dir-a .a-body{flex:1;min-width:0}
.dir-a .a-r1{display:flex;align-items:baseline;gap:8px}
.dir-a .a-name{font-family:var(--font-display);font-size:18px;font-weight:500;letter-spacing:-.005em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dir-a .a-time{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.dir-a .a-prev{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.dir-a .a-prev span{overflow:hidden;text-overflow:ellipsis}
.dir-a .a-fab{position:absolute;right:18px;bottom:40px;height:52px;padding:0 20px 0 16px;border-radius:16px;background:var(--ink);color:var(--on-ink);display:flex;align-items:center;gap:8px;font-weight:550;font-size:15px;box-shadow:0 8px 20px -8px rgba(0,0,0,.4)}

/* A — thread */
.dir-a .a-bar{display:flex;align-items:center;gap:4px;padding:2px 6px 8px;border-bottom:1px solid var(--line);flex:none;background:var(--bg)}
.dir-a .a-bar .tt{flex:1;min-width:0;padding-left:2px}
.dir-a .a-bar .nm{font-family:var(--font-display);font-size:21px;font-weight:500;line-height:1.15}
.dir-a .a-bar .st{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.dir-a .a-thread{flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:0 16px 6px;
  background-image:linear-gradient(to bottom,transparent 27px,color-mix(in srgb,var(--line) 55%,transparent) 28px);background-size:100% 28px}
.dir-a .a-day{display:flex;align-items:center;gap:12px;font-family:var(--font-display);font-style:italic;color:var(--muted);font-size:14.5px;margin:12px 0 4px;background:var(--bg)}
.dir-a .a-day::before,.dir-a .a-day::after{content:"";flex:1;height:1px;background:var(--line-strong)}
.dir-a .a-note{display:grid;grid-template-columns:38px 1fr;gap:0 10px;padding:7px 0}
.dir-a .a-note .t{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);padding-top:4px;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.dir-a .a-note .t .i{color:var(--accent)}
.dir-a .a-note .c{font-size:15px;line-height:1.5;min-width:0;background:var(--bg)}
.dir-a .a-note .c b{font-weight:600}
.dir-a .a-note .dev{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:10.5px;color:var(--muted);margin-bottom:2px}
.dir-a .a-cl-title{font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
.dir-a .a-cl-title span{font-family:var(--font-mono);font-size:11px;color:var(--muted);font-weight:400}
.dir-a .a-ci{display:flex;gap:10px;align-items:center;padding:3px 0}
.dir-a .box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line-strong);flex:none;display:flex;align-items:center;justify-content:center;color:var(--on-accent)}
.dir-a .box.on{background:var(--accent);border-color:var(--accent)}
.dir-a .a-ci.done span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.dir-a .a-voice{display:flex;align-items:center;gap:10px;color:var(--text)}
.dir-a .a-voice .play{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:flex;align-items:center;justify-content:center;flex:none}
.dir-a .a-voice .d{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.dir-a .a-voice .wave{color:var(--accent)}
.dir-a .a-trans{font-family:var(--font-display);font-style:italic;font-size:15px;color:var(--muted);margin-top:4px;line-height:1.45}
.dir-a .a-img{border-radius:12px;overflow:hidden;border:1px solid var(--line);display:block;width:100%;height:auto}
.dir-a .a-cap{font-size:14px;margin-top:5px}
.dir-a .a-quote{border-left:2px solid var(--accent);padding:1px 0 1px 10px;margin-bottom:5px;font-size:13px;color:var(--muted)}
.dir-a .a-quote .q1{font-family:var(--font-mono);font-size:10.5px;display:flex;gap:4px;align-items:center}
.dir-a .a-react{display:flex;gap:6px;margin-top:6px}
.dir-a .a-react span{height:26px;padding:0 9px;border-radius:999px;border:1px solid var(--line-strong);font-size:13px;display:inline-flex;align-items:center;gap:4px;background:var(--surface)}
.dir-a .a-react span em{font-style:normal;font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
.dir-a .a-rem{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;background:var(--accent-soft);color:var(--on-accent-soft);font-size:12px;font-weight:500;margin-top:6px}
.dir-a .a-file{display:flex;align-items:center;gap:12px;border:1px solid var(--line-strong);border-radius:12px;padding:9px 10px;background:var(--surface)}
.dir-a .a-file .ft{width:36px;height:40px;border-radius:7px;background:var(--accent-soft);color:var(--on-accent-soft);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:9.5px;font-weight:500}
.dir-a .a-file .fn{font-size:14px;font-weight:500}
.dir-a .a-file .fs{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.dir-a .a-comp{flex:none;padding:8px 10px 4px;display:flex;align-items:flex-end;gap:6px;background:var(--bg);border-top:1px solid var(--line)}
.dir-a .a-comp .field{flex:1;min-height:46px;border-radius:23px;background:var(--raised);border:1px solid var(--line-strong);display:flex;align-items:center;padding:0 6px 0 16px;color:var(--muted);font-size:15px}
.dir-a .a-comp .plus{width:46px;height:46px;border-radius:50%;border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:center;flex:none}
.dir-a .a-comp .mic{width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:flex;align-items:center;justify-content:center;flex:none}
.dir-a .a-comp .aa{font-family:var(--font-display);font-size:17px;color:var(--text);width:38px;height:38px;display:flex;align-items:center;justify-content:center}

/* A — actions sheet */
.dir-a .scrim{position:absolute;inset:0;background:var(--scrim)}
.dir-a .a-focus{position:absolute;left:12px;right:12px;top:200px;background:var(--surface);border-radius:16px;padding:12px 14px;box-shadow:0 20px 40px -20px rgba(0,0,0,.5)}
.dir-a .a-sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:24px 24px 36px 36px;padding:8px 0 26px}
.dir-a .grab{width:36px;height:4px;border-radius:4px;background:var(--line-strong);margin:4px auto 10px}
.dir-a .a-emoji{display:flex;justify-content:space-between;padding:0 18px 12px;border-bottom:1px solid var(--line)}
.dir-a .a-emoji span{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--bg)}
.dir-a .a-emoji span.on{box-shadow:0 0 0 2px var(--accent)}
.dir-a .a-act{display:flex;align-items:center;gap:16px;padding:0 22px;height:50px;font-size:15.5px}
.dir-a .a-act .k{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.dir-a .a-act.danger{color:var(--danger)}
.dir-a .a-acts-sep{height:1px;background:var(--line);margin:4px 0}

/* A — settings */
.dir-a .a-set{flex:1;overflow:hidden}
.dir-a .a-me{margin:6px 16px 4px;padding:14px;border-radius:16px;border:1px solid var(--line-strong);background:var(--surface);display:flex;gap:12px;align-items:center}
.dir-a .a-me .ph{width:44px;height:44px;border-radius:13px;background:var(--ink);color:var(--on-ink);display:flex;align-items:center;justify-content:center}
.dir-a .a-me .n{font-family:var(--font-display);font-size:18px;font-weight:500;line-height:1.2}
.dir-a .a-me .s{font-size:13px;color:var(--muted)}
.dir-a .a-srow{display:flex;align-items:center;gap:14px;padding:0 20px;min-height:58px;position:relative}
.dir-a .a-srow + .a-srow::before{content:"";position:absolute;top:0;left:56px;right:0;height:1px;background:var(--line)}
.dir-a .a-srow .i{color:var(--muted)}
.dir-a .a-srow .tx{flex:1;min-width:0;padding:9px 0}
.dir-a .a-srow .t1{font-size:15.5px}
.dir-a .a-srow .t2{font-size:13px;color:var(--muted)}
.dir-a .a-srow .v{font-family:var(--font-mono);font-size:11.5px;color:var(--muted)}
.dir-a .a-seg{display:flex;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;font-size:13px}
.dir-a .a-seg span{padding:6px 10px}
.dir-a .a-seg span.on{background:var(--ink);color:var(--on-ink)}
.dir-a .online{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:11px;color:#2F7D48}
.theme-dark .dir-a .online{color:#7CCB94}
.dir-a .online::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.sw{width:46px;height:28px;border-radius:14px;background:var(--line-strong);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw.on{background:var(--accent)}
.sw.on::after{left:21px}



/* ======================= Round 2 additions (Notebook) ======================= */
.dir-a{--kb:#E2DCD1;--kbkey:#FBF9F5;--kbkey2:#CFC7B9;--rec:#C2261B}
.theme-dark .dir-a{--kb:#0E0C09;--kbkey:#2A261F;--kbkey2:#3A342B;--rec:#FF6B5E}
.dir-a .sheet-title{font-family:var(--font-display);font-size:22px;font-weight:500;padding:0 22px 6px}
.dir-a .btn{height:48px;border-radius:14px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:550;font-size:15px}
.dir-a .btn.ink{background:var(--ink);color:var(--on-ink)}
.dir-a .btn.line{border:1px solid var(--line-strong)}
.dir-a .btn.full{width:100%}
.dir-a .linkbtn{color:var(--accent);font-weight:550;font-size:14.5px;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.dir-a .hue-dot{width:8px;height:8px;border-radius:3px;background:var(--h);display:inline-block;flex:none}
.dir-a .mono{font-family:var(--font-mono)}

/* keyboard */
.dir-a .kb{flex:none;background:var(--kb);padding:6px 3px 2px}
.dir-a .kb .r{display:flex;justify-content:center}
.dir-a .kb .k{flex:1;max-width:33px;height:42px;margin:4px 2.5px;border-radius:7px;background:var(--kbkey);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text);box-shadow:0 1px 0 rgba(0,0,0,.12)}
.dir-a .kb .k.w{max-width:none;flex:1.5;background:var(--kbkey2);font-size:13px}
.dir-a .kb .k.sp{max-width:none;flex:5}
.dir-a .kb .k.ent{max-width:none;flex:1.5;background:var(--accent);color:var(--on-accent)}

/* composer: writing state */
.dir-a .a-compx{flex:none;background:var(--surface);border-top:1px solid var(--line);padding:8px 10px 6px}
.dir-a .a-replying{display:flex;align-items:center;gap:10px;padding:2px 2px 8px 4px}
.dir-a .a-replying .bar{width:2px;align-self:stretch;background:var(--accent);border-radius:2px}
.dir-a .a-replying .t{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dir-a .a-replying .t b{display:block;font-family:var(--font-mono);font-size:10.5px;font-weight:400;color:var(--accent)}
.dir-a .a-editor{display:flex;align-items:flex-end;gap:8px}

.dir-a .a-editor .ed .caret{display:inline-block;width:2px;height:18px;background:var(--accent);vertical-align:-3px;margin-left:1px}
.dir-a .a-editor .send{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex:none}

.dir-a .a-fmt .sep{width:1px;height:22px;background:var(--line-strong);margin:0 4px}
.dir-a .a-fmt .col{width:18px;height:18px;border-radius:50%;background:conic-gradient(#B4471F,#C69214,#2F855A,#2B6CB0,#805AD5,#B4471F)}

/* recording */
.dir-a .a-rec{flex:none;background:var(--surface);border-top:1px solid var(--line);padding:14px 14px 10px}
.dir-a .a-rec .top{display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:13px}
.dir-a .a-rec .dot{width:10px;height:10px;border-radius:50%;background:var(--rec);box-shadow:0 0 0 5px color-mix(in srgb,var(--rec) 22%,transparent)}
.dir-a .a-rec .hint{margin-left:auto;font-family:var(--font-body);font-size:12.5px;color:var(--muted)}
.dir-a .a-rec .wave{height:56px;margin:12px 0 14px;color:var(--rec);gap:3px}
.dir-a .a-rec .wave i{width:3px;opacity:1}
.dir-a .a-rec .wave i.f{opacity:.22}
.dir-a .a-rec .ctl{display:flex;align-items:center;justify-content:space-between}
.dir-a .a-rec .c{width:52px;height:52px;border-radius:50%;border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:center}

.dir-a .a-sbar{display:flex;align-items:center;gap:4px;padding:2px 10px 10px 6px;flex:none}

/* reminders */
.dir-a .a-warn{margin:12px 16px 2px;border:1px solid var(--line-strong);border-radius:14px;padding:11px 12px;display:flex;gap:10px;font-size:13.5px;line-height:1.4;background:var(--surface)}

.dir-a .a-rem-row + .a-rem-row::before{content:"";position:absolute;top:0;left:80px;right:0;height:1px;background:var(--line)}
.dir-a .a-rem-row .tm{font-family:var(--font-mono);font-size:13px;font-weight:500}
.dir-a .a-rem-row .tm small{display:block;font-size:10.5px;font-weight:400;color:var(--muted)}
.dir-a .a-rem-row .tx{font-size:15px;line-height:1.35;min-width:0}
.dir-a .a-rem-row .ch{display:flex;align-items:center;gap:6px;font-family:var(--font-display);font-style:italic;font-size:13.5px;color:var(--muted);margin-top:2px}

.theme-dark .dir-a .a-hero .av{background:color-mix(in srgb,var(--h) 22%,var(--surface));color:color-mix(in srgb,var(--h) 55%,var(--text))}

<script>
(function(){
  var root=document.documentElement, body=document.body;
  try{if(window.self!==window.top)root.classList.add('embedded')}catch(e){root.classList.add('embedded')}
  // Status bars + gestures
  document.querySelectorAll('.sb:empty').forEach(function(s){s.innerHTML='<span>9:41</span><span class="ic"><i style="width:14px;height:9px"></i><i style="width:20px;height:10px;border-radius:3px"></i></span>'});
  // Waveforms
  document.querySelectorAll('.wave').forEach(function(w){
    var n=+w.dataset.n||30,p=+w.dataset.p||0,s=+w.dataset.seed||1,live=+w.dataset.live||0,big=w.closest('.a-rec')?2.2:1;
    for(var k=0;k<n;k++){s=(s*9301+49297)%233280;var h=(6+Math.round((s/233280)*20*(0.55+0.45*Math.sin(k/3))))*big;var b=document.createElement('i');b.style.height=Math.max(4,Math.abs(h))+'px';
      if(live){ if(k>=live){b.className='f';b.style.height='4px'} } else if(k/n<p)b.className='p';
      w.appendChild(b);}
  });
  // Keyboard
  document.querySelectorAll('[data-kb]').forEach(function(kb){
    var rows=['qwertyuiop','asdfghjkl'],html='';
    rows.forEach(function(r){html+='<div class="r">'+r.split('').map(function(c){return '<span class="k">'+c+'</span>'}).join('')+'</div>'});
    html+='<div class="r"><span class="k w">⇧</span>'+'zxcvbnm'.split('').map(function(c){return '<span class="k">'+c+'</span>'}).join('')+'<span class="k w">⌫</span></div>';
    html+='<div class="r"><span class="k w">?123</span><span class="k">,</span><span class="k sp"></span><span class="k">.</span><span class="k ent">↵</span></div>';
    kb.innerHTML=html;
  });
  // Fake QR
  document.querySelectorAll('[data-qr]').forEach(function(el){
    var N=29,s=7,r='';
    function finder(x,y){return '<rect x="'+x+'" y="'+y+'" width="7" height="7" fill="#111"/><rect x="'+(x+1)+'" y="'+(y+1)+'" width="5" height="5" fill="#fff"/><rect x="'+(x+2)+'" y="'+(y+2)+'" width="3" height="3" fill="#111"/>'}
    function inF(x,y){return (x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9)}
    for(var y=0;y<N;y++)for(var x=0;x<N;x++){ if(inF(x,y))continue; s=(s*9301+49297)%233280; if(s/233280>0.52) r+='<rect x="'+x+'" y="'+y+'" width="1.02" height="1.02" fill="#111"/>'; }
    el.innerHTML='<svg viewBox="0 0 '+N+' '+N+'" shape-rendering="crispEdges">'+r+finder(0,0)+finder(N-7,0)+finder(0,N-7)+'</svg>';
  });
  function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function read(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function setTheme(t){root.dataset.theme=t;body.classList.toggle('theme-dark',t==='dark');document.querySelectorAll('[data-theme-btn]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.themeBtn===t)});store('ncy-mock-theme',t)}
  document.querySelectorAll('[data-theme-btn]').forEach(function(b){b.onclick=function(){setTheme(b.dataset.themeBtn)}});
  setTheme(read('ncy-mock-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
})();
</script>
